[package]
name = "coffer-desktop"
version = "0.3.0"
description = "Coffer desktop app: a native shell for a self-hosted Coffer server"
authors = ["Odd Omens LLC <support@oddomens.com>"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "coffer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-store = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
