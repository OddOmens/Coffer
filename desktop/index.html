<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Coffer</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 1024 1024">
          <rect x="64" y="64" width="896" height="896" rx="200" fill="currentColor" />
          <g fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
            <rect x="244" y="224" width="536" height="536" rx="80" />
            <path d="M332 760v48M692 760v48" />
            <circle cx="512" cy="492" r="128" />
            <path d="M512 492V364M512 492l111 64M512 492l-111 64" />
          </g>
          <circle cx="512" cy="492" r="36" fill="#fff" />
        </svg>
      </div>

      <!-- Connecting to the saved server -->
      <section id="view-busy" class="view" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Connecting…</h1>
        <p class="muted" id="busy-url"></p>
      </section>

      <!-- Saved server unreachable -->
      <section id="view-offline" class="view" hidden>
        <h1>Can't reach your server</h1>
        <p class="muted" id="offline-url"></p>
        <p class="error" id="offline-error" role="alert"></p>
        <div class="actions">
          <button type="button" class="primary" id="retry">Try again</button>
          <button type="button" class="secondary" id="change">Change server</button>
        </div>
      </section>

      <!-- Enter a server address -->
      <section id="view-form" class="view" hidden>
        <h1>Connect to Coffer</h1>
        <p class="muted">Enter the address of your Coffer server.</p>
        <form id="form" novalidate>
          <label for="url">Server address</label>
          <input
            id="url"
            name="url"
            type="text"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://files.example.com"
            required
          />
          <p class="hint">For example http://192.168.1.20:8080 on your network.</p>
          <p class="error" id="form-error" role="alert" hidden></p>
          <button type="submit" class="primary" id="submit">Connect</button>
        </form>
      </section>
    </main>
    <footer class="muted" id="version"></footer>
  </body>
</html>
