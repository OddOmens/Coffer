name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Coffer version
      description: Shown under Admin → Monitoring, or run `docker compose exec coffer /coffer version`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Web app
        - Share links
        - Desktop app (macOS)
        - Desktop app (Linux)
        - WebDAV
        - SMB
        - Media previews
        - Install / Docker
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs coffer`. Remove anything private (names, addresses, file names) first.
      render: text
